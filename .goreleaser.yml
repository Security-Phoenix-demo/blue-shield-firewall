# Phoenix Security Blue Shield - Firewall — GoReleaser configuration
# Userland release: unsigned binaries + checksums.
# Signing deferred: Apple Developer Program + Windows EV cert procurement pending.
version: 2

project_name: phoenix-firewall

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: phoenix-firewall
    main: .
    binary: phoenix-firewall
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Security-Phoenix-demo/blue-shield-firewall/cmd.version={{.Version}}
      - -X github.com/Security-Phoenix-demo/blue-shield-firewall/cmd.commit={{.Commit}}
      - -X github.com/Security-Phoenix-demo/blue-shield-firewall/cmd.date={{.Date}}
      - -X github.com/Security-Phoenix-demo/blue-shield-firewall/internal/version.Agent={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Cosign keyless signing — anchors checksums.txt in the Sigstore transparency
# log (Rekor) via a short-lived Fulcio cert tied to this workflow's OIDC
# identity. Free, no secrets, no procurement. Does NOT satisfy macOS Gatekeeper
# or Windows SmartScreen — those need an OS-trusted CA chain (see docs/INSTALL.md §8).
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge remote-tracking branch

release:
  github:
    owner: Security-Phoenix-demo
    name: blue-shield-firewall
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## Phoenix Security Blue Shield - Firewall v{{.Version}}

    ### Installation (userland — no root, no MDM)

    ```bash
    # macOS / Linux
    curl -sSfL https://github.com/Security-Phoenix-demo/blue-shield-firewall/releases/download/v{{.Version}}/phoenix-firewall_{{.Version}}_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz | tar -xz
    mv phoenix-firewall ~/.local/bin/
    phoenix-firewall init
    phoenix-firewall enroll --api-key <your-key>
    ```

    > **Note on code signing**: binaries in this release are unsigned.
    > Apple notarization and Windows EV code signing are pending procurement.
    > Verify integrity via the provided `checksums.txt` (SHA-256).

  footer: |
    **Full Changelog**: https://github.com/Security-Phoenix-demo/blue-shield-firewall/compare/{{.PreviousTag}}...{{.Tag}}

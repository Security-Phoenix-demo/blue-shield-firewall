name: Release phoenix-firewall

# Triggers
#   - tag push v*    → full GitHub release (binaries + cosign + SLSA + SBOM)
#   - manual dispatch → snapshot build (uploaded as workflow artifact only)
#
# Signed by:
#   - Sigstore keyless (Fulcio + Rekor) via the goreleaser `signs:` block
#   - SLSA Level 3 provenance via slsa-framework/slsa-github-generator
#
# Code signing for OS gatekeepers (Apple Developer ID, Windows Authenticode)
# is deferred — see docs/INSTALL.md §8 for the procurement table.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot build (no publish)'
        type: boolean
        default: true

permissions:
  contents: write   # goreleaser uploads release assets
  packages: write
  id-token: write   # OIDC token for Sigstore keyless + SLSA generator

jobs:
  goreleaser:
    name: Build + cosign-sign + SBOM
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout (with history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Syft (SBOM generator used by goreleaser)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Release (tag push) — build only, skip publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Windows binary (Azure Trusted Signing)
        # Runs only when Azure Trusted Signing secrets are present. Skipped
        # gracefully in forks and repos without the secret set; cosign keyless
        # signing (above) is the baseline integrity guarantee.
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          secrets.AZURE_TENANT_ID != ''
        id: azure_sign
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE_NAME }}
          files-folder: dist/
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Recompute checksums after signing
        # Only re-hash when Azure signing actually ran and modified the .exe.
        # Skipping avoids invalidating the cosign signature on checksums.txt.
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          steps.azure_sign.outcome == 'success'
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish release with signed artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --skip=build --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot build (manual dispatch — dry run, signing skipped)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SLSA subject hashes
        if: startsWith(github.ref, 'refs/tags/v')
        id: hash
        run: |
          cd dist
          # Hash every published archive (tarballs + zips). SLSA provenance
          # binds these hashes to the build identity in step `provenance` below.
          sha256sum *.tar.gz *.zip > artifact-hashes.txt
          cat artifact-hashes.txt
          echo "hashes=$(base64 -w0 artifact-hashes.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-firewall-snapshot
          path: dist/*
          retention-days: 7

  provenance:
    name: SLSA L3 provenance
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read     # required for the SLSA generator to introspect the run
      id-token: write   # required to mint the OIDC token bound to this workflow
      contents: write   # required to attach the attestation to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      provenance-name: "phoenix-firewall.intoto.jsonl"
